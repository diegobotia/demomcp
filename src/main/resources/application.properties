spring.application.name=demomcp

spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.stdio=false

server.port=8088

logging.file.name=./logs/demomcp.log
logging.level.root=INFO
logging.level.org.springboot.ai=DEBUG

spring.datasource.url=jdbc:mysql://localhost:3306/demomcp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false



